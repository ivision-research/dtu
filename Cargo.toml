[workspace]
members = [
  "dtu",
  "cli",
  "dtu_proc_macro",
  "protoc_generate",
  "dtu-fs",
  "dtu-decompile",
  "dtu-py",
  "complete",
]

resolver = "2"

[workspace.package]
version = "7.0.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
libc = "0.2.88"
log = "0.4"
regex = "1.11"
anyhow = "1.0"
bitflags = "2.9"
bumpalo = { version = "3.17" }
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rstest = "0.16"
mockall = "0.13"
base64 = "0.21"
itertools = "0.13"
lazy_static = "1.4"
yoke =  "0.8"
sha2 = "0.10"
tempfile = "3.19"
env_logger = "0.11"
flexi_logger = { version = "0.30", features = ["dont_minimize_extra_stacks"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
postcard = { version = "1.0.0", features = ["alloc", "use-std"] }

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 1
